# .github/workflows/main.yml
name: DevSecOps Pipeline

on: [push, pull_request]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        working-directory: ./app
        run: pip install -r requirements.txt

  # In .github/workflows/main.yml

  custom-sast-scan:
    name: "Custom SAST Scan"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # --- NEW DEBUGGING STEPS ---
      - name: List files in the workspace
        run: ls -R

      - name: Show Current Working Directory
        run: pwd
      # --- END DEBUGGING STEPS ---

      - name: Run Custom SAST Scanner
        run: python sast-scanner/sast_scanner.py
  

  custom-sca-scan:
    name: "Custom SCA Scan"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Run Custom SCA Scanner
        run: python sca-scanner/scanner.py

# In .github/workflows/main.yml

# ... (keep your existing build, custom-sast-scan, and custom-sca-scan jobs)

  # --- NEW JOB FOR IAC SCANNING ---
  iac-scan:
    name: "IaC Scan (Terraform)"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install IaC Scanner Dependencies
        # The runner needs the hcl2 library to parse the files
        run: pip install python-hcl2

      - name: Run Custom IaC Scanner
        run: python iac-scanner/scanner.py

  js-sast-scan:
    name: "JavaScript SAST Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Run Custom JS SAST Scanner
        run: python js-sast-scanner/scanner.py
      # - name: Run Custom JS SAST Scanner Action
      #   # This line calls YOUR action from its repository at version v1
      #   uses: Sahilmir18/js-sast-scanner-action@v2
      #   with:
      #   # This provides the input that your action expects
      #     scan-directory: './vulnerable-react-app'

  # --- NEW JOB FOR JAVASCRIPT SCA ---
  js-sca-scan:
    name: "JavaScript SCA Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Run Custom JS SCA Scanner
        run: python js-sca-scanner/scanner.py